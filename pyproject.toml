[project]
name = "sitready-ai"
version = "0.1.0"
description = "Autonomous contractor readiness agent for Health & Safety and SHEQ teams."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "google-adk[gcp]>=2.7.1,<3",
    "google-cloud-firestore>=2.25.0",
    "httpx2>=2.12.0",
    "uvicorn>=0.52.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
